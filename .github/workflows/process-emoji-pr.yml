name: Process Emoji PR

on:
  workflow_dispatch:
    inputs:
      specific_file:
        description: 'Process a specific file (e.g., "Animated/joel.gif")'
        required: false
        type: string
      force_reprocess:
        description: 'Force reprocess all GIFs (clears processed list)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - ratbranch

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD | tr '\n' ',')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Check for duplicate emoji
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        with:
          script: |
            const script = require('./.github/scripts/check-duplicates.js');
            await script({ github, context, changedFiles: process.env.CHANGED_FILES });

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gifsicle imagemagick jq

      - name: Get files to process
        id: files
        run: bash .github/scripts/find-unprocessed.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIC_FILE: ${{ github.event.inputs.specific_file }}
          FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Optimize GIF files
        id: optimize
        run: bash .github/scripts/optimize-gifs.sh
        env:
          UNPROCESSED: ${{ steps.files.outputs.unprocessed }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        run: bash .github/scripts/commit-changes.sh
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          COMMIT_MESSAGE: "Optimize GIF files [skip ci]"

      - name: Update processed files list
        if: steps.optimize.outputs.processed != ''
        run: bash .github/scripts/update-processed-list.sh
        env:
          FILE_TYPE: gif
          PROCESSED: ${{ steps.optimize.outputs.processed }}
          PREVIOUS_COMMIT: ${{ steps.commit.outputs.committed }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}

      - name: Create check run on new commit
        if: steps.commit.outputs.committed != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const newSha = require('child_process').execSync('git rev-parse HEAD').toString().trim();
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Process Emoji PR / process (pull_request)',
              head_sha: newSha,
              status: 'completed',
              conclusion: 'success'
            });
