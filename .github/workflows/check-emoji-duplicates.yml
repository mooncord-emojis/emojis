name: Check Emoji Duplicates

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for duplicate emoji
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/check-duplicates.js');
            await script({ github, context });
