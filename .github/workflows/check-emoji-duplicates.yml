name: Check Emoji Duplicates

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for duplicate emoji
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Only check PRs from the emoji submission bot
            const isAddEmoji = pr.title.startsWith('Add emoji:');
            const isUpdateEmoji = pr.title.startsWith('Update emoji:');

            if (!isAddEmoji && !isUpdateEmoji) {
              console.log('Not an emoji submission PR, skipping.');
              return;
            }

            // Check for "Update" label - skip duplicate check if present
            const labels = pr.labels.map(l => l.name);
            if (labels.includes('Update')) {
              console.log('PR has "Update" label, skipping duplicate check.');
              return;
            }

            // Get files changed in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            console.log(`Files in PR: ${files.length}`);
            files.forEach(f => console.log(`  - ${f.filename} (${f.status})`));

            // Find image files
            const imageExtensions = ['.png', '.gif', '.webp', '.jpg', '.jpeg'];
            const imageFiles = files.filter(f => {
              const lowerName = f.filename.toLowerCase();
              return imageExtensions.some(ext => lowerName.endsWith(ext));
            });

            if (imageFiles.length === 0) {
              console.log('No image files found in PR.');
              return;
            }

            // Get the base name of each image file (without extension)
            const newEmojiNames = imageFiles.map(f => {
              const fileName = f.filename.split('/').pop();
              return fileName.replace(/\.[^.]+$/, '').toLowerCase();
            });

            console.log(`New emoji names: ${newEmojiNames.join(', ')}`);

            // Get full tree of base branch to check for existing files
            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: pr.base.sha,
              recursive: 'true'
            });

            // Check for any existing file with the same base name (ignoring extension)
            const duplicates = tree.tree.filter(item => {
              if (item.type !== 'blob') return false;
              const fileName = item.path.split('/').pop();
              const baseName = fileName.replace(/\.[^.]+$/, '').toLowerCase();
              return newEmojiNames.includes(baseName);
            });

            if (duplicates.length > 0) {
              const duplicatePaths = duplicates.map(d => `\`${d.path}\``).join('\n- ');
              const duplicateNames = [...new Set(duplicates.map(d => {
                const fileName = d.path.split('/').pop();
                return fileName.replace(/\.[^.]+$/, '');
              }))].join(', ');

              // Post comment explaining the duplicate
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## Duplicate Emoji Detected\n\nAn emoji with a matching name already exists in the repository:\n\n- ${duplicatePaths}\n\nThis PR has been automatically closed. Please choose a different name for your emoji and submit again.\n\nIf you intended to update an existing emoji, please resubmit with the "Update Existing Emoji" checkbox checked.\n\n---\n*This check was performed automatically.*`
              });

              // Close the PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });

              console.log(`PR #${pr.number} closed due to duplicate emoji: ${duplicateNames}`);
            } else {
              console.log('No duplicates found.');
            }
