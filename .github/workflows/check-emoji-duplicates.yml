name: Check Emoji Duplicates

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for duplicate emoji
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Only check PRs from the emoji submission bot
            if (!pr.title.startsWith('Add emoji:')) {
              console.log('Not an emoji submission PR, skipping.');
              return;
            }

            // Extract emoji name from PR title
            const match = pr.title.match(/^Add emoji:\s*(.+)$/);
            if (!match) {
              console.log('Could not parse emoji name from title.');
              return;
            }

            const emojiName = match[1].trim();
            console.log(`Checking for duplicate: ${emojiName}`);

            // Get list of changed files in this PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            // Find the new emoji file path
            const newFile = files.find(f => f.status === 'added');
            if (!newFile) {
              console.log('No new files found in PR.');
              return;
            }

            const newFilePath = newFile.filename;
            const newFileName = newFilePath.split('/').pop();
            const newEmojiBaseName = newFileName.replace(/\.[^.]+$/, '');

            console.log(`New file: ${newFilePath}`);
            console.log(`Emoji base name: ${newEmojiBaseName}`);

            // Get full tree of base branch to check for existing files
            const { data: tree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: pr.base.sha,
              recursive: 'true'
            });

            // Check for any file with the same base name (ignoring extension)
            const duplicates = tree.tree.filter(item => {
              if (item.type !== 'blob') return false;
              const fileName = item.path.split('/').pop();
              const baseName = fileName.replace(/\.[^.]+$/, '');
              return baseName.toLowerCase() === newEmojiBaseName.toLowerCase();
            });

            if (duplicates.length > 0) {
              const duplicatePaths = duplicates.map(d => `\`${d.path}\``).join('\n- ');

              // Post comment explaining the duplicate
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## Duplicate Emoji Detected

            An emoji with the name **\`${newEmojiBaseName}\`** already exists in the repository:

            - ${duplicatePaths}

            This PR has been automatically closed. Please choose a different name for your emoji and submit again.

            ---
            *This check was performed automatically.*`
              });

              // Close the PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });

              console.log(`PR #${pr.number} closed due to duplicate emoji: ${newEmojiBaseName}`);
            } else {
              console.log('No duplicates found.');
            }
