name: Convert WebP Files

on:
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: 'Force reprocess all WebPs (clears processed list)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - ratbranch

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Add Processing label
        if: github.event_name == 'pull_request'
        run: gh pr edit ${{ github.event.pull_request.number }} --add-label "Processing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gifsicle ffmpeg webp imagemagick jq

      - name: Get files to process
        id: files-to-process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROCESSED_FILE=".github/processed-files.json"

          # Force reprocess: clear the WebPs list
          if [ "${{ github.event.inputs.force_reprocess }}" = "true" ]; then
            echo "Force reprocess requested - clearing WebP list"
            if [ -f "$PROCESSED_FILE" ]; then
              jq '.webps = []' "$PROCESSED_FILE" > "${PROCESSED_FILE}.tmp" && mv "${PROCESSED_FILE}.tmp" "$PROCESSED_FILE"
            fi
          fi

          # Get changed WebPs - use GitHub API for PRs (faster, no need for full git history)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            current_commit_webps=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename' | grep -iE '\.webp$' || true)
          else
            current_commit_webps=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -iE '\.webp$' || true)
          fi

          # If processed file doesn't exist, create it with all existing WebPs except current commit's
          if [ ! -f "$PROCESSED_FILE" ]; then
            echo "Creating processed-files.json..."
            mkdir -p .github

            # Get all WebPs in repo
            all_webps=$(find . -type f -iname "*.webp" | sed 's|^\./||' | sort)

            # Build initial list excluding current commit's files
            initial_webps="[]"
            while IFS= read -r webp; do
              [ -z "$webp" ] && continue
              # Check if this WebP is in current commit (should be processed, not skipped)
              if ! echo "$current_commit_webps" | grep -qxF "$webp"; then
                initial_webps=$(echo "$initial_webps" | jq --arg f "$webp" '. + [$f]')
              fi
            done <<< "$all_webps"

            echo "{\"gifs\": [], \"webps\": $initial_webps}" | jq '.' > "$PROCESSED_FILE"
            echo "Created with $(echo "$initial_webps" | jq 'length') pre-existing WebPs"
          fi

          # Get all WebPs in repo
          all_webps=$(find . -type f -iname "*.webp" | sed 's|^\./||' | sort)

          # Find WebPs not in processed list
          unprocessed=""
          while IFS= read -r webp; do
            [ -z "$webp" ] && continue
            if ! jq -e --arg f "$webp" '.webps | index($f)' "$PROCESSED_FILE" > /dev/null 2>&1; then
              unprocessed="${unprocessed}${webp}"$'\n'
            fi
          done <<< "$all_webps"

          echo "WebPs to process:"
          echo "$unprocessed"
          echo "unprocessed<<EOF" >> $GITHUB_OUTPUT
          echo "$unprocessed" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Convert WebP files
        id: convert-webp
        run: |
          unprocessed="${{ steps.files-to-process.outputs.unprocessed }}"
          PROCESSED_FILE=".github/processed-files.json"

          if [ -z "$unprocessed" ]; then
            echo "No WebP files to process"
            exit 0
          fi

          echo "$unprocessed" | while read webp; do
            [ -z "$webp" ] && continue
            [ ! -f "$webp" ] && echo "Skipping missing file: $webp" && continue

            echo "Processing: $webp"
            success=false

            # Check if WebP is animated using webpmux
            frame_count=$(webpmux -info "$webp" 2>/dev/null | grep -c "^[[:space:]]*[0-9]*:" || echo "1")

            if [ "$frame_count" -gt 1 ] 2>/dev/null; then
              # Animated WebP -> GIF
              echo "  Animated WebP ($frame_count frames), converting to GIF..."
              gif="${webp%.*}.gif"

              # Use ImageMagick - ffmpeg doesn't support animated WebP
              if convert "$webp" -coalesce -dither FloydSteinberg -colors 256 -layers OptimizeTransparency "$gif" 2>&1; then
                if [ -f "$gif" ] && [ "$(stat -c%s "$gif")" -gt 100 ]; then
                  echo "  Converted to: $gif"
                  rm "$webp"
                  echo "  Removed original WebP"
                  echo "$gif" >> /tmp/converted_gifs.txt
                  success=true
                else
                  echo "  Failed to convert (output file empty or missing)"
                  rm -f "$gif"
                fi
              else
                echo "  Failed to convert"
              fi
            else
              # Static WebP -> PNG
              echo "  Static WebP, converting to PNG..."
              png="${webp%.*}.png"

              if ffmpeg -y -i "$webp" "$png" 2>/dev/null; then
                echo "  Converted to: $png"
                rm "$webp"
                echo "  Removed original WebP"
                success=true
              else
                echo "  Failed to convert"
              fi
            fi

            # Track successfully processed files
            if [ "$success" = true ]; then
              echo "$webp" >> /tmp/processed-webps.txt
              echo "  Successfully processed"
            fi
          done

          # Output the list of successfully processed files
          if [ -f /tmp/processed-webps.txt ]; then
            echo "processed<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/processed-webps.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Coalesce converted GIFs
        id: coalesce
        run: |
          if [ ! -f /tmp/converted_gifs.txt ]; then
            echo "No converted GIFs to coalesce"
            exit 0
          fi

          cat /tmp/converted_gifs.txt | while read gif; do
            [ -z "$gif" ] && continue
            [ ! -f "$gif" ] && continue

            echo "Coalescing: $gif"

            frame_count=$(gifsicle --info "$gif" 2>/dev/null | grep -c "image #" || echo "1")

            if [ "$frame_count" -gt 1 ] 2>/dev/null; then
              # First pass: ImageMagick coalesce
              if convert "$gif" -coalesce "${gif}.tmp" 2>/dev/null; then
                mv "${gif}.tmp" "$gif"
                echo "  ImageMagick coalesce done"
              fi

              # Second pass: gifsicle unoptimize
              if gifsicle --unoptimize "$gif" -o "${gif}.tmp" 2>/dev/null; then
                mv "${gif}.tmp" "$gif"
                echo "  Gifsicle unoptimize done"

                file_size=$(stat -c%s "$gif")
                max_size=10485760

                if [ "$file_size" -gt "$max_size" ]; then
                  echo "  File is $(($file_size / 1024 / 1024)) MB, scaling down..."

                  for scale in 0.9 0.8 0.7 0.6 0.5 0.4 0.3; do
                    echo "    Trying scale ${scale}..."
                    if gifsicle --scale "$scale" "$gif" -o "${gif}.tmp" 2>/dev/null; then
                      new_size=$(stat -c%s "${gif}.tmp")
                      echo "    Result: $(($new_size / 1024 / 1024)) MB"

                      if [ "$new_size" -le "$max_size" ]; then
                        mv "${gif}.tmp" "$gif"
                        echo "  Scaled to ${scale}x successfully"
                        break
                      fi
                      rm -f "${gif}.tmp"
                    else
                      echo "    Scale failed"
                      break
                    fi
                  done
                fi

                # Track successfully coalesced GIF
                echo "$gif" >> /tmp/coalesced-gifs.txt
                echo "  Successfully coalesced"
              else
                rm -f "${gif}.tmp"
                echo "  Failed to coalesce"
              fi
            fi
          done

          # Output the list of successfully coalesced GIFs
          if [ -f /tmp/coalesced-gifs.txt ]; then
            echo "coalesced<<EOF" >> $GITHUB_OUTPUT
            cat /tmp/coalesced-gifs.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A

          # Check if there's actually anything staged to commit
          if git diff --cached --quiet; then
            echo "No changes staged, skipping commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Convert WebP files [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Update processed files list
        if: steps.convert-webp.outputs.processed != '' || steps.coalesce.outputs.coalesced != ''
        run: |
          PROCESSED_FILE=".github/processed-files.json"
          processedWebps="${{ steps.convert-webp.outputs.processed }}"
          coalescedGifs="${{ steps.coalesce.outputs.coalesced }}"

          # Add processed WebPs
          if [ -n "$processedWebps" ]; then
            echo "Adding successfully processed WebPs to processed list..."
            while IFS= read -r webp; do
              [ -z "$webp" ] && continue
              jq --arg f "$webp" '.webps += [$f] | .webps |= unique' "$PROCESSED_FILE" > "${PROCESSED_FILE}.tmp"
              mv "${PROCESSED_FILE}.tmp" "$PROCESSED_FILE"
              echo "  Added WebP: $webp"
            done <<< "$processedWebps"
          fi

          # Add coalesced GIFs
          if [ -n "$coalescedGifs" ]; then
            echo "Adding successfully coalesced GIFs to processed list..."
            while IFS= read -r gif; do
              [ -z "$gif" ] && continue
              jq --arg f "$gif" '.gifs += [$f] | .gifs |= unique' "$PROCESSED_FILE" > "${PROCESSED_FILE}.tmp"
              mv "${PROCESSED_FILE}.tmp" "$PROCESSED_FILE"
              echo "  Added GIF: $gif"
            done <<< "$coalescedGifs"
          fi

          git add "$PROCESSED_FILE"

          # Only commit if the JSON actually changed
          if ! git diff --cached --quiet; then
            if [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
              git commit --amend --no-edit
            else
              git commit -m "Update processed files list [skip ci]"
            fi
            git push origin HEAD:${{ github.event.pull_request.head.ref }} --force-with-lease
          else
            echo "Processed list unchanged"
          fi

      - name: Create check runs on new commit
        if: (steps.convert-webp.outputs.processed != '' || steps.coalesce.outputs.coalesced != '') && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newSha=$(git rev-parse HEAD)
          echo "Creating check runs on commit $newSha"

          for checkName in coalesce convert check-duplicates; do
            gh api repos/${{ github.repository }}/check-runs \
              -f name="$checkName" \
              -f head_sha="$newSha" \
              -f status="completed" \
              -f conclusion="success" \
              -f output='{"title":"Processed by workflow","summary":"This commit was created by a workflow. Processing already completed."}'
            echo "  Created check run: $checkName"
          done

      - name: Remove Processing label
        if: always() && github.event_name == 'pull_request'
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label "Processing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}