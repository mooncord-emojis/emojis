name: Convert WebP Files

on:
  workflow_dispatch:
    inputs:
      force_reprocess:
        description: 'Force reprocess all WebPs (clears processed list)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - ratbranch

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gifsicle ffmpeg webp imagemagick jq

      - name: Get files to process
        id: files
        run: bash .github/scripts/find-unprocessed.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE_TYPE: webp
          FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Convert WebP files
        id: convert
        run: bash .github/scripts/convert-webps.sh
        env:
          UNPROCESSED: ${{ steps.files.outputs.unprocessed }}

      - name: Coalesce converted GIFs
        id: coalesce
        if: steps.convert.outputs.convertedGifs != ''
        run: bash .github/scripts/process-gifs.sh
        env:
          UNPROCESSED: ${{ steps.convert.outputs.convertedGifs }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        run: bash .github/scripts/commit-changes.sh
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          COMMIT_MESSAGE: "Convert WebP files [skip ci]"

      - name: Update processed WebPs list
        if: steps.convert.outputs.processed != ''
        run: bash .github/scripts/update-processed-list.sh
        env:
          FILE_TYPE: webp
          PROCESSED: ${{ steps.convert.outputs.processed }}
          SKIP_COMMIT: ${{ steps.coalesce.outputs.processed != '' }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          PREVIOUS_COMMIT: ${{ steps.commit.outputs.committed }}

      - name: Update processed GIFs list
        if: steps.coalesce.outputs.processed != ''
        run: bash .github/scripts/update-processed-list.sh
        env:
          FILE_TYPE: gif
          PROCESSED: ${{ steps.coalesce.outputs.processed }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          PREVIOUS_COMMIT: "true"

      - name: Create check runs on new commit
        if: (steps.convert.outputs.processed != '' || steps.coalesce.outputs.processed != '') && github.event_name == 'pull_request'
        run: bash .github/scripts/create-check-runs.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}

