name: Coalesce GIF Frames

on:
  workflow_dispatch:
  push:
    branches:
      - ratbranch
    paths:
      - '**.gif'
      - '**.GIF'
      - '**.webp'
      - '**.WEBP'

jobs:
  coalesce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gifsicle ffmpeg webp

      - name: Get changed files
        id: changed-files
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # First push to branch - get all relevant files in the commit
            changed_gifs=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -iE '\.gif$' || true)
            changed_webps=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -iE '\.webp$' || true)
          else
            # Normal push - get changed files between commits
            changed_gifs=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -iE '\.gif$' || true)
            changed_webps=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -iE '\.webp$' || true)
          fi
          echo "Changed GIFs:"
          echo "$changed_gifs"
          echo "Changed WebPs:"
          echo "$changed_webps"
          echo "changed_gifs<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_gifs" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "changed_webps<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_webps" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Convert WebP files
        id: convert-webp
        run: |
          changed_webps="${{ steps.changed-files.outputs.changed_webps }}"

          if [ -z "$changed_webps" ]; then
            echo "No WebP files changed in this push"
            echo "converted_gifs=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$changed_webps" | while read webp; do
            # Skip empty lines
            [ -z "$webp" ] && continue

            # Check if file exists (might have been deleted)
            [ ! -f "$webp" ] && echo "Skipping deleted file: $webp" && continue

            echo "Processing: $webp"

            # Check if WebP is animated using webpmux
            frame_count=$(webpmux -info "$webp" 2>/dev/null | grep -c "^[[:space:]]*[0-9]*:" || echo "1")

            if [ "$frame_count" -gt 1 ] 2>/dev/null; then
              # Animated WebP -> GIF
              echo "  Animated WebP ($frame_count frames), converting to GIF..."
              gif="${webp%.*}.gif"

              if ffmpeg -y -i "$webp" "$gif" 2>/dev/null; then
                echo "  Converted to: $gif"
                rm "$webp"
                echo "  Removed original WebP"
                echo "$gif" >> /tmp/converted_gifs.txt
              else
                echo "  Failed to convert"
              fi
            else
              # Static WebP -> PNG
              echo "  Static WebP, converting to PNG..."
              png="${webp%.*}.png"

              if ffmpeg -y -i "$webp" "$png" 2>/dev/null; then
                echo "  Converted to: $png"
                rm "$webp"
                echo "  Removed original WebP"
              else
                echo "  Failed to convert"
              fi
            fi
          done

          # Output converted GIFs for the next step
          if [ -f /tmp/converted_gifs.txt ]; then
            converted=$(cat /tmp/converted_gifs.txt)
            echo "converted_gifs<<EOF" >> $GITHUB_OUTPUT
            echo "$converted" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "converted_gifs=" >> $GITHUB_OUTPUT
          fi

      - name: Coalesce GIF files
        run: |
          changed_gifs="${{ steps.changed-files.outputs.changed_gifs }}"
          converted_gifs="${{ steps.convert-webp.outputs.converted_gifs }}"

          # Combine original GIFs and converted GIFs
          all_gifs=$(printf "%s\n%s" "$changed_gifs" "$converted_gifs" | grep -v '^$' || true)

          if [ -z "$all_gifs" ]; then
            echo "No GIF files to process"
            exit 0
          fi

          echo "$all_gifs" | while read gif; do
            # Skip empty lines
            [ -z "$gif" ] && continue

            # Check if file exists (might have been deleted)
            [ ! -f "$gif" ] && echo "Skipping deleted file: $gif" && continue

            echo "Processing: $gif"

            # Check if GIF has multiple frames using gifsicle
            frame_count=$(gifsicle --info "$gif" 2>/dev/null | grep -c "image #" || echo "1")

            if [ "$frame_count" -gt 1 ] 2>/dev/null; then
              echo "  Found $frame_count frames, coalescing..."

              # Unoptimize the GIF (expands partial frames into complete frames)
              if gifsicle --unoptimize "$gif" -o "${gif}.tmp" 2>/dev/null; then
                mv "${gif}.tmp" "$gif"
                echo "  Coalesced successfully"

                # Check if file is over 10 MB (10485760 bytes)
                file_size=$(stat -c%s "$gif")
                max_size=10485760

                if [ "$file_size" -gt "$max_size" ]; then
                  echo "  File is $(($file_size / 1024 / 1024)) MB, scaling down..."

                  # Try progressively smaller scales until under 10 MB
                  for scale in 0.9 0.8 0.7 0.6 0.5 0.4 0.3; do
                    echo "    Trying scale ${scale}..."
                    if gifsicle --scale "$scale" "$gif" -o "${gif}.tmp" 2>/dev/null; then
                      new_size=$(stat -c%s "${gif}.tmp")
                      echo "    Result: $(($new_size / 1024 / 1024)) MB"

                      if [ "$new_size" -le "$max_size" ]; then
                        mv "${gif}.tmp" "$gif"
                        echo "  Scaled to ${scale}x successfully"
                        break
                      fi
                      rm -f "${gif}.tmp"
                    else
                      echo "    Scale failed"
                      break
                    fi
                  done
                fi
              else
                rm -f "${gif}.tmp"
                echo "  Failed to coalesce"
              fi
            else
              echo "  Single frame or not animated, skipping"
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Coalesce animated GIF frames"
          git push
