name: Coalesce GIF Frames

on:
  workflow_dispatch:
  push:
    branches:
      - ratbranch
    paths:
      - '**.gif'
      - '**.GIF'

jobs:
  coalesce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gifsicle imagemagick

      - name: Get changed GIF files
        id: changed-files
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed_gifs=$(git diff-tree --no-commit-id --name-only -r HEAD | grep -iE '\.gif$' || true)
          else
            changed_gifs=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -iE '\.gif$' || true)
          fi
          echo "Changed GIFs:"
          echo "$changed_gifs"
          echo "changed_gifs<<EOF" >> $GITHUB_OUTPUT
          echo "$changed_gifs" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Coalesce GIF files
        run: |
          changed_gifs="${{ steps.changed-files.outputs.changed_gifs }}"

          if [ -z "$changed_gifs" ]; then
            echo "No GIF files changed in this push"
            exit 0
          fi

          echo "$changed_gifs" | while read gif; do
            [ -z "$gif" ] && continue
            [ ! -f "$gif" ] && echo "Skipping deleted file: $gif" && continue

            echo "Processing: $gif"

            frame_count=$(gifsicle --info "$gif" 2>/dev/null | grep -c "image #" || echo "1")

            if [ "$frame_count" -gt 1 ] 2>/dev/null; then
              echo "  Found $frame_count frames, coalescing..."

              # First pass: ImageMagick coalesce
              if convert "$gif" -coalesce "${gif}.tmp" 2>/dev/null; then
                mv "${gif}.tmp" "$gif"
                echo "  ImageMagick coalesce done"
              fi

              # Second pass: gifsicle unoptimize
              if gifsicle --unoptimize "$gif" -o "${gif}.tmp" 2>/dev/null; then
                mv "${gif}.tmp" "$gif"
                echo "  Gifsicle unoptimize done"

                file_size=$(stat -c%s "$gif")
                max_size=10485760

                if [ "$file_size" -gt "$max_size" ]; then
                  echo "  File is $(($file_size / 1024 / 1024)) MB, scaling down..."

                  for scale in 0.9 0.8 0.7 0.6 0.5 0.4 0.3; do
                    echo "    Trying scale ${scale}..."
                    if gifsicle --scale "$scale" "$gif" -o "${gif}.tmp" 2>/dev/null; then
                      new_size=$(stat -c%s "${gif}.tmp")
                      echo "    Result: $(($new_size / 1024 / 1024)) MB"

                      if [ "$new_size" -le "$max_size" ]; then
                        mv "${gif}.tmp" "$gif"
                        echo "  Scaled to ${scale}x successfully"
                        break
                      fi
                      rm -f "${gif}.tmp"
                    else
                      echo "    Scale failed"
                      break
                    fi
                  done
                fi
              else
                rm -f "${gif}.tmp"
                echo "  Failed to coalesce"
              fi
            else
              echo "  Single frame or not animated, skipping"
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit --amend --no-edit
          git push --force-with-lease
