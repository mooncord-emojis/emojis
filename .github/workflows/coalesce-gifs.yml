name: Coalesce GIF Frames

on:
  workflow_dispatch:
    inputs:
      specific_file:
        description: 'Process a specific file (e.g., "Animated/joel.gif")'
        required: false
        type: string
      force_reprocess:
        description: 'Force reprocess all GIFs (clears processed list)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - ratbranch

jobs:
  coalesce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gifsicle imagemagick jq

      - name: Get files to process
        id: files
        run: bash .github/scripts/find-unprocessed.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIC_FILE: ${{ github.event.inputs.specific_file }}
          FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Coalesce GIF files
        id: coalesce
        run: bash .github/scripts/process-gifs.sh
        env:
          UNPROCESSED: ${{ steps.files.outputs.unprocessed }}

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        run: bash .github/scripts/commit-changes.sh
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          COMMIT_MESSAGE: "Process GIF files [skip ci]"

      - name: Update processed files list
        if: steps.coalesce.outputs.processed != ''
        run: bash .github/scripts/update-processed-list.sh
        env:
          FILE_TYPE: gif
          PROCESSED: ${{ steps.coalesce.outputs.processed }}
          PREVIOUS_COMMIT: ${{ steps.commit.outputs.committed }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}

      - name: Create check run on new commit
        if: steps.coalesce.outputs.processed != '' && github.event_name == 'pull_request'
        run: bash .github/scripts/create-check-runs.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CHECK_NAME: coalesce
          CHECK_CONCLUSION: success

