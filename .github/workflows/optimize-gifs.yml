name: Optimize GIF Files

on:
  workflow_dispatch:
    inputs:
      specific_file:
        description: 'Process a specific file (e.g., "Animated/joel.gif")'
        required: false
        type: string
      force_reprocess:
        description: 'Force reprocess all GIFs (clears processed list)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - ratbranch

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Check if triggered by own commit
        id: check-skip
        if: github.event_name == 'pull_request'
        run: |
          MESSAGE=$(gh api repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }} --jq '.commit.message')
          if [[ "$MESSAGE" == "Optimize GIF files"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping - triggered by optimization commit"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        if: steps.check-skip.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - name: Install tools
        if: steps.check-skip.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y gifsicle imagemagick jq

      - name: Get files to process
        if: steps.check-skip.outputs.skip != 'true'
        id: files
        run: bash .github/scripts/find-unprocessed.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPECIFIC_FILE: ${{ github.event.inputs.specific_file }}
          FORCE_REPROCESS: ${{ github.event.inputs.force_reprocess }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Optimize GIF files
        if: steps.check-skip.outputs.skip != 'true'
        id: optimize
        run: bash .github/scripts/optimize-gifs.sh
        env:
          UNPROCESSED: ${{ steps.files.outputs.unprocessed }}

      - name: Check for changes
        if: steps.check-skip.outputs.skip != 'true'
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        id: commit
        if: steps.check-skip.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: bash .github/scripts/commit-changes.sh
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          COMMIT_MESSAGE: "Optimize GIF files"

      - name: Update processed files list
        if: steps.check-skip.outputs.skip != 'true' && steps.optimize.outputs.processed != ''
        run: bash .github/scripts/update-processed-list.sh
        env:
          FILE_TYPE: gif
          PROCESSED: ${{ steps.optimize.outputs.processed }}
          PREVIOUS_COMMIT: ${{ steps.commit.outputs.committed }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}

      - name: Create check run on new commit
        if: steps.check-skip.outputs.skip != 'true' && steps.commit.outputs.committed != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const newSha = require('child_process').execSync('git rev-parse HEAD').toString().trim();
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Optimize GIF Files / optimize (pull_request)',
              head_sha: newSha,
              status: 'completed',
              conclusion: 'success'
            });

      - name: Create check run when skipped
        if: steps.check-skip.outputs.skip == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Optimize GIF Files / optimize (pull_request)',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion: 'success'
            });
